            <stop stop-color="#8056D8" />
            <stop offset="1" stop-color="#281650" />
        </linearGradient>
        <linearGradient id="gold" x1="17" y1="12" x2="47" y2="52" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FFF1A8" />
            <stop offset=".52" stop-color="#E9C45B" />
            <stop offset="1" stop-color="#C89731" />
        </linearGradient>
    </defs>

    <rect x="1" y="1" width="62" height="62" rx="18" fill="url(#violet)" />
    <rect x="2" y="2" width="60" height="60" rx="17" stroke="#FFF0A0" stroke-opacity=".42" stroke-width="1.5" />

