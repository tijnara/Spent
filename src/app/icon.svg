        stroke-linecap="round"
        stroke-linejoin="round"
    />
    <path d="M32 15.6v4.1M32 44.3v4.1" stroke="#FFF0A0" stroke-width="2.1" stroke-linecap="round" />
    <circle cx="32" cy="32" r="1.8" fill="#FFF1A8" />
