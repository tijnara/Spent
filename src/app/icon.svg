<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="spentVioletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7C3AED" />
            <stop offset="100%" stop-color="#3B1A7A" />
        </linearGradient>
        <linearGradient id="spentGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FEF08A" />
            <stop offset="100%" stop-color="#ECC94B" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1E0B36" flood-opacity="0.45" />
        </filter>
    </defs>

    <!-- Squircle Base -->
    <rect width="64" height="64" rx="18" fill="url(#spentVioletGrad)" />

    <!-- Subtle Yellow Inset Rim -->
    <rect x="1.5" y="1.5" width="61" height="61" rx="16.5" stroke="#ECC94B" stroke-opacity="0.3" stroke-width="1.5" />

    <!-- Golden Dollar Currency Spine -->
    <path d="M32 9V17M32 47V55" stroke="url(#spentGoldGrad)" stroke-width="5" stroke-linecap="round" />

    <!-- Bold Yellow 'S' Ribbon -->
    <path d="M43 23C43 17 38 13.5 32 13.5C24.5 13.5 20 17.5 20 23.5C20 32 44 29 44 39.5C44 46 39 50.5 32 50.5C24.5 50.5 20 46.5 20 40.5"
          stroke="url(#spentGoldGrad)"
          stroke-width="6.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#shadow)" />

    <!-- Center Accent Golden Coin / Tracker Pulse -->
    <circle cx="32" cy="32" r="3.2" fill="url(#spentGoldGrad)" />
</svg>
